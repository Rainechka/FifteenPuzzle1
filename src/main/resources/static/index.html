<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пятнашки — REST API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .board {
            display: grid;
            gap: 4px;
            margin-top: 20px;
        }
        .tile {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #4CAF50;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .tile:hover {
            transform: scale(1.05);
        }
        .tile.empty {
            background-color: #e0e0e0;
            color: #999;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            font-weight: bold;
            color: #d32f2f;
        }
        .win {
            color: #388e3c;
        }
    </style>
</head>
<body>
<h1>Игра «Пятнашки»</h1>

<div class="controls">
    <label for="size">Размер:</label>
    <select id="size">
        <option value="3">3×3</option>
        <option value="4" selected>4×4</option>
        <option value="5">5×5</option>
    </select>
    <button id="resetBtn">Сбросить игру</button>
</div>

<div id="board" class="board"></div>
<div id="message" class="message"></div>

<script>
    const API_BASE = '/game/default';
    const boardContainer = document.getElementById('board');
    const messageEl = document.getElementById('message');
    const sizeSelect = document.getElementById('size');
    const resetBtn = document.getElementById('resetBtn');

    // Инициализация
    resetBtn.addEventListener('click', resetGame);
    loadBoard();

    async function resetGame() {
        const size = parseInt(sizeSelect.value);
        try {
            const response = await fetch(`${API_BASE}/reset`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ size })
            });
            if (response.ok) {
                messageEl.textContent = '';
                messageEl.className = 'message';
                loadBoard();
            } else {
                throw new Error('Ошибка сброса');
            }
        } catch (err) {
            messageEl.textContent = 'Не удалось сбросить игру';
            messageEl.className = 'message';
        }
    }

    async function loadBoard() {
        try {
            const response = await fetch(`${API_BASE}/board`);
            if (!response.ok) throw new Error('Не удалось загрузить доску');
            const data = await response.json();
            renderBoard(data.board, data.size);
        } catch (err) {
            messageEl.textContent = 'Ошибка загрузки доски';
            messageEl.className = 'message';
        }
    }

    function renderBoard(flatBoard, size) {
        boardContainer.innerHTML = '';
        boardContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        boardContainer.style.width = `${Math.min(400, 64 * size)}px`;

        flatBoard.forEach((value, index) => {
            const button = document.createElement('button');
            button.className = value === 0 ? 'tile empty' : 'tile';
            button.textContent = value === 0 ? '' : value;

            if (value !== 0) {
                button.addEventListener('click', () => moveTile(value));
            }

            boardContainer.appendChild(button);
        });
    }

    async function moveTile(tileId) {
        try {
            const response = await fetch(`${API_BASE}/move`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tileId })
            });
            if (!response.ok) throw new Error('Ошибка хода');
            const result = await response.json();

            renderBoard(result.board, result.size);

            if (result.solved) {
                messageEl.textContent = '🎉 Поздравляем! Вы выиграли!';
                messageEl.className = 'message win';
                // Автоматический сброс через 2 секунды
                setTimeout(resetGame, 2000);
            } else if (!result.movable) {
                messageEl.textContent = 'Нельзя переместить эту плитку!';
                messageEl.className = 'message';
            } else {
                messageEl.textContent = '';
            }
        } catch (err) {
            messageEl.textContent = 'Ошибка при перемещении';
            messageEl.className = 'message';
        }
    }
</script>
</body>
</html>
