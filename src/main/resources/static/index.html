<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пятнашки — REST API</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            color: #2c3e50;
            margin: 0 0 8px 0;
        }
        #timer {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
        }
        button:hover {
            background: #fa423c;
        }
        .board-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .board {
            display: grid;
            gap: 4px;
        }
        .leaderboard-panel {
            position: absolute;
            left: 100%;
            top: 0;
            margin-left: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 300px;
            width: 280px;
        }
        .tile {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #4CAF50;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .tile.empty {
            background-color: #e0e0e0;
            color: #999;
            cursor: not-allowed;
        }
        .message {
            margin: 15px 0;
            font-weight: bold;
            color: #d32f2f;
            min-height: 24px;
            text-align: center;
        }
        .leaderboard-panel h2 {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
            font-size: 18px;
        }
        .leaderboard-panel h3 {
            margin: 12px 0 6px 0;
            color: #3498db;
            font-size: 15px;
        }
        .leaderboard-panel ol {
            padding-left: 20px;
            margin: 0;
        }
        .leaderboard-panel li {
            margin-bottom: 5px;
        }
        .leaderboard-panel p {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }

        /* Адаптивность */
        @media (max-width: 900px) {
            .leaderboard-panel {
                position: static;
                margin: 20px auto 0;
                margin-left: 0;
                max-width: 500px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="game-header">
    <h1>Игра «Пятнашки»</h1>
    <div id="timer">Время: 0 сек</div>
</div>

<div class="controls">
    <label for="size">Размер:</label>
    <select id="size">
        <option value="3">3×3</option>
        <option value="4" selected>4×4</option>
        <option value="5">5×5</option>
    </select>
    <button id="resetBtn">Сбросить</button>
</div>

<div class="board-container">
    <div id="board" class="board"></div>
    <div class="leaderboard-panel">
        <h2>🏆 Таблица рекордов</h2>
        <div id="leaderboard-content">
            <p>Загрузка...</p>
        </div>
    </div>
</div>

<div id="message" class="message"></div>

<script>
    const API_BASE = '/game/default';
    const boardContainer = document.getElementById('board');
    const messageEl = document.getElementById('message');
    const sizeSelect = document.getElementById('size');
    const resetBtn = document.getElementById('resetBtn');
    const timerEl = document.getElementById('timer');
    const leaderboardContent = document.getElementById('leaderboard-content');

    let clientTimer = 0;
    let timerInterval = null;
    let gameFinished = false;
    let gameStarted = false;

    resetBtn.addEventListener('click', resetGame);
    loadInitialData();

    function loadInitialData() {
        loadBoard();
        loadLeaderboard();
    }

    function updateTimerDisplay(seconds) {
        timerEl.textContent = `Время: ${seconds} сек`;
    }

    function startClientTimer() {
        if (timerInterval) return;
        clientTimer = 0;
        updateTimerDisplay(clientTimer);
        timerInterval = setInterval(() => {
            clientTimer++;
            updateTimerDisplay(clientTimer);
        }, 1000);
    }

    function stopClientTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    async function resetGame() {
        stopClientTimer();
        gameStarted = false;
        gameFinished = false;
        const size = parseInt(sizeSelect.value);
        try {
            const response = await fetch(`${API_BASE}/reset`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ size })
            });
            if (response.ok) {
                messageEl.textContent = '';
                updateTimerDisplay(0);
                loadBoard();
            }
        } catch (err) {
            messageEl.textContent = 'Ошибка сброса игры';
        }
    }

    async function loadBoard() {
        try {
            const response = await fetch(`${API_BASE}/board`);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const data = await response.json();
            renderBoard(data.board, data.size);

            if (data.timeSeconds > 0 && !gameFinished) {
                gameStarted = true;
                clientTimer = data.timeSeconds;
                updateTimerDisplay(clientTimer);
                if (!timerInterval) {
                    stopClientTimer();
                    timerInterval = setInterval(() => {
                        clientTimer++;
                        updateTimerDisplay(clientTimer);
                    }, 1000);
                }
            } else {
                updateTimerDisplay(0);
            }
        } catch (err) {
            console.error('Ошибка загрузки доски:', err);
            messageEl.textContent = 'Не удалось загрузить доску';
        }
    }

    function renderBoard(flatBoard, size) {
        boardContainer.innerHTML = '';
        boardContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        boardContainer.style.width = `${Math.min(400, 64 * size)}px`;

        flatBoard.forEach(value => {
            const button = document.createElement('button');
            button.className = value === 0 ? 'tile empty' : 'tile';
            button.textContent = value === 0 ? '' : value;
            if (value !== 0 && !gameFinished) {
                button.addEventListener('click', () => moveTile(value));
            }
            boardContainer.appendChild(button);
        });
    }

    async function moveTile(tileId) {
        if (gameFinished) return;

        if (!gameStarted) {
            gameStarted = true;
            startClientTimer();
        }

        try {
            const response = await fetch(`${API_BASE}/move`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tileId })
            });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const result = await response.json();
            renderBoard(result.board, result.size);

            if (result.solved) {
                gameFinished = true;
                stopClientTimer();
                showWinDialog(clientTimer);
            } else if (!result.movable) {
                messageEl.textContent = 'Нельзя переместить эту плитку!';
            } else {
                messageEl.textContent = '';
            }
        } catch (err) {
            console.error('Ошибка хода:', err);
            messageEl.textContent = 'Ошибка при перемещении';
        }
    }

    async function loadLeaderboard() {
        leaderboardContent.innerHTML = '<p>Загрузка...</p>';
        try {
            const response = await fetch('/leaderboard');
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const records = await response.json();

            if (!Array.isArray(records)) {
                throw new Error('Некорректный формат');
            }

            let html = '';
            [3, 4, 5].forEach(size => {
                const sizeRecords = records
                    .filter(r => r.size === size)
                    .sort((a, b) => a.timeSeconds - b.timeSeconds)
                    .slice(0, 5);

                if (sizeRecords.length > 0) {
                    html += `<h3>${size}×${size}</h3><ol>`;
                    sizeRecords.forEach(r => {
                        const name = r.playerName || 'Аноним';
                        html += `<li><strong>${name}</strong> — ${r.timeSeconds} сек</li>`;
                    });
                    html += `</ol>`;
                }
            });

            if (!html) {
                html = '<p>Пока нет рекордов</p>';
            }

            leaderboardContent.innerHTML = html;
        } catch (e) {
            console.error('Ошибка загрузки рекордов:', e);
            leaderboardContent.innerHTML = '<p>Не удалось загрузить</p>';
        }
    }

    function showWinDialog(time) {
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0,0,0,0.7)';
        overlay.style.display = 'flex';
        overlay.style.justifyContent = 'center';
        overlay.style.alignItems = 'center';
        overlay.style.zIndex = '1000';

        const dialog = document.createElement('div');
        dialog.style.backgroundColor = 'white';
        dialog.style.padding = '20px';
        dialog.style.borderRadius = '10px';
        dialog.style.textAlign = 'center';
        dialog.innerHTML = `
            <h2>🎉 Победа!</h2>
            <p>Ваше время: <strong>${time} секунд</strong></p>
            <input type="text" id="playerName" placeholder="Введите имя (до 20 символов)" maxlength="20" />
            <br><br>
            <button id="saveRecordBtn">Сохранить рекорд</button>
            <button id="playAgainBtn">Играть снова</button>
        `;
        overlay.appendChild(dialog);
        document.body.appendChild(overlay);

        document.getElementById('playAgainBtn').onclick = () => {
            document.body.removeChild(overlay);
            resetGame();
        };

        document.getElementById('saveRecordBtn').onclick = async () => {
            const name = document.getElementById('playerName').value.trim();
            if (!name) {
                alert('Пожалуйста, введите имя!');
                return;
            }
            try {
                const resp = await fetch(`${API_BASE}/finish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerName: name })
                });
                if (resp.ok) {
                    alert('Рекорд успешно сохранён!');
                    document.body.removeChild(overlay);
                    loadLeaderboard();
                    resetGame();
                } else {
                    const err = await resp.json().catch(() => ({}));
                    alert('Ошибка: ' + (err.message || 'Не удалось сохранить'));
                }
            } catch (e) {
                console.error('Ошибка сохранения:', e);
                alert('Ошибка при сохранении рекорда');
            }
        };
    }
</script>
</body>
</html>
